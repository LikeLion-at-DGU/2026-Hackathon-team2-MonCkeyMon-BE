name: Deploy Backend

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: mcm-backend
  EC2_INSTANCE_ID: i-0902c0b9209b39ba7
  ECR_REGISTRY: 709297672559.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mcm-backend" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin 709297672559.dkr.ecr.ap-northeast-2.amazonaws.com",
              "sudo docker pull 709297672559.dkr.ecr.ap-northeast-2.amazonaws.com/mcm-backend:latest",
              "sudo docker rm -f mcm-backend || true",
              "sudo docker run -d --name mcm-backend --restart unless-stopped --env-file /opt/mcm/.env -p 127.0.0.1:8000:8000 -v /opt/mcm/data:/app/data -v /opt/mcm/media:/app/media -v /opt/mcm/staticfiles:/app/staticfiles 709297672559.dkr.ecr.ap-northeast-2.amazonaws.com/mcm-backend:latest",
              "sudo docker exec mcm-backend python manage.py migrate",
              "sudo docker exec mcm-backend python manage.py collectstatic --noinput"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"